[project]
name = "email-agent"
version = "0.1.0"
description = "A minimal, extensible Python starter for building an email agent."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "IMAPClient>=3.0",
    "python-dotenv>=1.0",
    "typer>=0.27.1",
    "structlog>=25.1.0",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[project.scripts]
email-agent = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
